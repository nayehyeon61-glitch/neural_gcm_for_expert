name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
