[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralgcm-expert"
version = "0.1.0"
description = "Deterministic variable-decomposed learned physics on official NeuralGCM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "neuralgcm==1.2.2", "dinosaur==1.5.0", "jax==0.7.2", "jaxlib==0.7.2",
  "dm-haiku==0.0.17", "gin-config>=0.5,<0.6", "optax==0.2.8",
  "numpy>=1.26", "xarray>=2024.1", "pandas>=2", "scipy>=1.11",
  "h5netcdf>=1.3", "h5py>=3.11", "zarr>=2.17,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ngcm-expert = "neuralgcm_expert.cli:main"

[tool.setuptools.packages.find]
include = ["neuralgcm_expert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real NeuralGCM encode/advance/decode and autodiff (CPU intensive)"]
